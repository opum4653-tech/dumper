name: Build NINMODS Dumper

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Libs & APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Clean Local Config & Accept Licenses
        run: |
          rm -f local.properties
          yes | sdkmanager --licenses || true

      - name: Build Native Libraries with ndk-build
        run: |
          echo "============================================================"
          echo "Building NINMODS native libraries (arm64-v8a & armeabi-v7a)..."
          echo "============================================================"
          export NDK_BIN="ndk-build"
          if command -v ndk-build &> /dev/null; then
            NDK_BIN="ndk-build"
          elif [ -n "$ANDROID_NDK_ROOT" ] && [ -f "$ANDROID_NDK_ROOT/ndk-build" ]; then
            NDK_BIN="$ANDROID_NDK_ROOT/ndk-build"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -f "$ANDROID_NDK_HOME/ndk-build" ]; then
            NDK_BIN="$ANDROID_NDK_HOME/ndk-build"
          fi
          echo "Using NDK binary: $NDK_BIN"
          
          $NDK_BIN -C app/src/main -j$(nproc) V=1 2>&1 | tee ndk_build.log
          
          mkdir -p output_libs/arm64-v8a
          mkdir -p output_libs/armeabi-v7a
          
          if [ -f "app/src/main/libs/arm64-v8a/libNINMODS.so" ]; then
            cp "app/src/main/libs/arm64-v8a/libNINMODS.so" output_libs/arm64-v8a/
            echo "[OK] Found libNINMODS.so for arm64-v8a"
          fi
          
          if [ -f "app/src/main/libs/armeabi-v7a/libNINMODS.so" ]; then
            cp "app/src/main/libs/armeabi-v7a/libNINMODS.so" output_libs/armeabi-v7a/
            echo "[OK] Found libNINMODS.so for armeabi-v7a"
          fi

      - name: Upload NDK Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndk-build-log
          path: ndk_build.log
          if-no-files-found: ignore

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        continue-on-error: true
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Collect and Verify Output Binaries
        run: |
          echo "============================================================"
          echo "Collecting compiled native libraries from all build stages..."
          echo "============================================================"
          mkdir -p output_libs/arm64-v8a
          mkdir -p output_libs/armeabi-v7a

          # 1. Search for any built libNINMODS.so across the workspace
          find . -type f -name "libNINMODS.so" | while read -r libPath; do
            echo "Found compiled library: $libPath"
            if echo "$libPath" | grep -q "arm64-v8a"; then
              cp -f "$libPath" output_libs/arm64-v8a/
            elif echo "$libPath" | grep -q "armeabi-v7a"; then
              cp -f "$libPath" output_libs/armeabi-v7a/
            fi
          done

          # 2. Extract from generated release APK if present
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
            echo "Extracting native libraries from APK: $APK_FILE"
            mkdir -p /tmp/apk_unpacked
            unzip -q -o "$APK_FILE" "lib/*" -d /tmp/apk_unpacked || true
            if [ -f "/tmp/apk_unpacked/lib/arm64-v8a/libNINMODS.so" ]; then
              cp -f "/tmp/apk_unpacked/lib/arm64-v8a/libNINMODS.so" output_libs/arm64-v8a/
              echo "[OK] Extracted arm64-v8a from APK"
            fi
            if [ -f "/tmp/apk_unpacked/lib/armeabi-v7a/libNINMODS.so" ]; then
              cp -f "/tmp/apk_unpacked/lib/armeabi-v7a/libNINMODS.so" output_libs/armeabi-v7a/
              echo "[OK] Extracted armeabi-v7a from APK"
            fi
          fi

          echo "============================================================"
          echo "Verified Output Binaries:"
          echo "============================================================"
          ls -la output_libs/* || true
          if [ ! -f "output_libs/arm64-v8a/libNINMODS.so" ] && [ ! -f "output_libs/armeabi-v7a/libNINMODS.so" ]; then
            echo "ERROR: Native libraries were not found!"
            exit 1
          fi

      - name: Upload Native Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Dumper-Libs
          path: output_libs/
          retention-days: 14

      - name: Upload Release APK (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output_libs/arm64-v8a/libNINMODS.so
            output_libs/armeabi-v7a/libNINMODS.so
            app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}
          name: "NINMODS Universal Il2Cpp Dumper ${{ github.ref_name }}"
          body: |
            ## NINMODS In-Memory Il2Cpp Dumper & Live Inspector
            - **Native Injected Library**: `libNINMODS.so` (arm64-v8a & armeabi-v7a)
            - **Smali / Dex Injection**: Compatible with `System.loadLibrary("NINMODS")`
            - **Universal Support**: Works across all Unity Il2Cpp games & versions
            - **Direct Storage Dump**: Automatically writes `dump.cs`, `script.json`, `stringliteral.json`, `il2cpp.h`, and `global-metadata.dat` to `/storage/emulated/0/Download/NINMODS_DUMP/`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
