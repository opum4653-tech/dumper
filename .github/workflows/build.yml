name: Build NINMODS Dumper

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Libs & APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build Native Libraries with ndk-build
        run: |
          set -o pipefail
          mkdir -p output_libs
          ndk-build \
            NDK_PROJECT_PATH=app/src/main \
            APP_BUILD_SCRIPT=app/src/main/jni/Android.mk \
            NDK_APPLICATION_MK=app/src/main/jni/Application.mk \
            NDK_LIBS_OUT=$(pwd)/output_libs \
            -j$(nproc) 2>&1 | tee ndk_build.log
          test -f output_libs/arm64-v8a/libNINMODS.so
          test -f output_libs/armeabi-v7a/libNINMODS.so

          # Stage into jniLibs so Gradle packages them into the APK.
          mkdir -p app/src/main/libs/arm64-v8a app/src/main/libs/armeabi-v7a
          cp -f output_libs/arm64-v8a/libNINMODS.so   app/src/main/libs/arm64-v8a/
          cp -f output_libs/armeabi-v7a/libNINMODS.so app/src/main/libs/armeabi-v7a/

      - name: Upload NDK Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndk-build-log
          path: ndk_build.log
          if-no-files-found: ignore

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Output Binaries
        run: |
          set -e
          echo "=== NATIVE LIBS ==="
          ls -la output_libs/arm64-v8a output_libs/armeabi-v7a
          test -f output_libs/arm64-v8a/libNINMODS.so
          test -f output_libs/armeabi-v7a/libNINMODS.so

          echo "=== APKs ==="
          mkdir -p release_apks
          find app/build/outputs/apk -name "*.apk" -exec cp -f {} release_apks/ \;
          ls -la release_apks

          echo "=== APK CONTENTS (native entries) ==="
          for apk in release_apks/*.apk; do
            echo "-- $apk"
            unzip -l "$apk" | grep -E "lib/.*/libNINMODS\.so" || true
          done

          test -f release_apks/app-release.apk || ls release_apks/*.apk > /dev/null
          echo "APK + both ABI libraries verified."

      - name: Upload Native Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Dumper-Libs
          path: output_libs/
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Release-APK
          path: release_apks/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output_libs/arm64-v8a/libNINMODS.so
            output_libs/armeabi-v7a/libNINMODS.so
            release_apks/*.apk
          tag_name: "v1.0.0"
          name: "NINMODS Universal Il2Cpp Dumper v1.0.0"
          draft: false
          prerelease: false
          body: |
            ## NINMODS In-Memory Il2Cpp Dumper

            - **Release APK** with `libNINMODS.so` bundled for `arm64-v8a` and `armeabi-v7a`
            - **Standalone native libraries** for manual injection or repackaging
            - **Loadable via** `System.loadLibrary("NINMODS")`
            - **Writes** `dump.cs`, `script.json`, `stringliteral.json`, `il2cpp.h` and `global-metadata.dat` to `/storage/emulated/0/Download/NINMODS_DUMP/`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
